<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чат OutlookAI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-light">
  <div id="app">
    <div class="app-toolbar">
      <div class="app-toolbar-left">
        <button id="btnClear" class="header-icon-btn new-chat-btn" type="button" title="Новый чат" aria-label="Новый чат">
          <span class="new-chat-icon" aria-hidden="true">＋</span>
        </button>
      </div>
      <div class="app-toolbar-right">
        <button id="btnCopy" class="header-icon-btn" type="button" title="Скопировать диалог" aria-label="Скопировать диалог">⧉</button>
      </div>
    </div>
    <div id="messages" class="messages" role="log" aria-live="polite"></div>
    <div class="bottom-zone">
      <div id="actionWorkspace" class="action-workspace" hidden>
        <section class="action-section">
          <div class="action-section-title">Все действия</div>
          <div id="actionGroups" class="action-button-row"></div>
        </section>
        <section id="recommendationsSection" class="action-section" hidden>
          <div class="action-section-title">Рекомендации ИИ</div>
          <div id="recommendationsLoading" class="recommendations-loading" hidden aria-label="Подбираются рекомендации">
            <span></span><span></span><span></span>
          </div>
          <div id="actionRecommendations" class="action-button-row"></div>
        </section>
        <div id="actionGroupPopover" class="action-group-popover" hidden></div>
      </div>
      <div id="quickActions" class="quick-actions"></div>
      <div id="composerResizer"
           class="composer-resizer"
           role="separator"
           aria-orientation="horizontal"
           aria-label="Изменить высоту поля ввода"
           tabindex="0">
        <span class="composer-resizer-grip" aria-hidden="true"></span>
      </div>
      <div id="composer" class="composer">
        <textarea id="composerInput"
                  class="composer-input"
                  rows="3"
                  placeholder="Спросите об этом письме или переписке..."
                  aria-label="Поле ввода чата"></textarea>
        <div class="composer-controls">
          <div class="composer-actions">
            <button id="btnStop" class="send-btn stop-btn" type="button" title="Остановить" aria-label="Остановить" hidden>■</button>
            <button id="btnSend" class="send-btn" type="button" title="Отправить" aria-label="Отправить">➤</button>
          </div>
        </div>
      </div>
      <div class="disclaimer">AI-помощник может ошибаться. Проверяйте важную информацию.</div>
    </div>
    <div id="actionGroupEditor" class="group-editor" hidden>
      <div class="group-editor-header">
        <button id="btnGroupEditorClose" class="icon-btn" type="button" title="Назад" aria-label="Назад">‹</button>
        <div id="groupEditorTitle" class="custom-action-title"></div>
        <button id="btnGroupAddAction" class="icon-btn" type="button" title="Добавить действие" aria-label="Добавить действие">＋</button>
      </div>
      <div class="group-editor-toolbar">
        <button id="btnGroupImport" class="btn btn-ghost" type="button">Импорт YAML</button>
        <button id="btnGroupExport" class="btn btn-ghost" type="button">Экспорт всех</button>
        <button id="btnGroupReset" class="btn btn-ghost danger-text" type="button">Сбросить группу</button>
        <input id="groupImportFile" type="file" accept=".yaml,.yml,text/yaml,text/plain" hidden>
      </div>
      <div id="groupImportPanel" class="group-import-panel" hidden>
        <label class="field-label" for="groupImportText">YAML</label>
        <textarea id="groupImportText" class="field-input field-textarea" rows="9"></textarea>
        <div class="group-import-actions">
          <button id="btnGroupImportFile" class="btn btn-ghost" type="button">Выбрать файл</button>
          <button id="btnGroupImportCancel" class="btn btn-ghost" type="button">Отмена</button>
          <button id="btnGroupImportApply" class="btn btn-primary" type="button">Импортировать</button>
        </div>
      </div>
      <div id="groupEditorActions" class="group-editor-actions"></div>
    </div>
    <div id="customActionDialog" class="custom-action-dialog" hidden>
      <div class="custom-action-panel" role="dialog" aria-modal="true" aria-labelledby="customActionTitle">
        <div class="custom-action-header">
          <div id="customActionTitle" class="custom-action-title">Новое действие</div>
          <button id="btnCustomActionClose" class="icon-btn" type="button" title="Закрыть" aria-label="Закрыть">×</button>
        </div>
        <div class="custom-action-body">
          <label class="field-label" for="customActionName">Название</label>
          <input id="customActionName" class="field-input" type="text" maxlength="80">
          <label class="field-label" for="customActionHint">Описание</label>
          <input id="customActionHint" class="field-input" type="text" maxlength="160">
          <label class="field-label" for="customActionPrompt">Промпт</label>
          <textarea id="customActionPrompt" class="field-input field-textarea" rows="7"></textarea>
          <div class="field-grid">
            <label class="field-label">Источник
              <select id="customActionSource" class="field-input">
                <option value="current_selection">Выбранные сообщения</option>
                <option value="current_open_message">Текущее открытое сообщение</option>
                <option value="related_thread">Вся связанная переписка</option>
                <option value="current_folder">Текущая папка</option>
                <option value="all_folders">Все папки</option>
              </select>
            </label>
            <label id="customActionFilterField" class="field-label">Фильтр
              <select id="customActionFilter" class="field-input">
                <option value="all">Все</option>
                <option value="unread">Непрочитанные</option>
                <option value="read">Прочитанные</option>
              </select>
            </label>
            <label id="customActionPeriodField" class="field-label">Период
              <select id="customActionPeriod" class="field-input">
                <option value="last_hour">Последний час</option>
                <option value="today">Сегодня</option>
                <option value="yesterday">Вчера</option>
                <option value="since_last_run">С последнего запуска</option>
                <option value="manual">Вручную</option>
              </select>
            </label>
            <label id="customActionMaxItemsField" class="field-label">Максимум писем
              <input id="customActionMaxItems" class="field-input" type="number" min="1" max="100" value="20">
            </label>
            <label id="customActionManualFromField" class="field-label" hidden>Начало периода
              <input id="customActionManualFrom" class="field-input" type="datetime-local">
            </label>
            <label id="customActionManualToField" class="field-label" hidden>Конец периода
              <input id="customActionManualTo" class="field-input" type="datetime-local">
            </label>
          </div>
          <div class="field-row">
            <label id="customActionFullBodiesField"><input id="customActionFullBodies" type="checkbox" checked> Полные тела писем</label>
            <label id="customActionAttachmentsField"><input id="customActionAttachments" type="checkbox"> Вложения/метаданные</label>
          </div>
          <label class="field-label">Результат
            <select id="customActionOutput" class="field-input">
              <option value="chat">Показать в чате</option>
              <option value="create_reply">Создать ответ</option>
              <option value="create_meeting">Создать встречу</option>
              <option value="export_pdf">Экспорт PDF</option>
              <option value="export_excel">Экспорт Excel</option>
            </select>
          </label>
          <div id="customActionToolsField" class="custom-action-tools-field" hidden>
            <div class="field-label">Доступные tools</div>
            <div id="customActionTools" class="custom-action-tools"></div>
          </div>
        </div>
        <div class="custom-action-footer">
          <button id="btnCustomActionCancel" class="btn btn-ghost" type="button">Отмена</button>
          <button id="btnCustomActionSave" class="btn btn-primary" type="button">Добавить</button>
        </div>
      </div>
    </div>
    <div id="customActionMenu" class="custom-action-menu" role="menu" hidden>
      <button id="btnCustomActionEdit" type="button" role="menuitem">Изменить</button>
      <button id="btnCustomActionDelete" type="button" role="menuitem" class="danger">Удалить</button>
    </div>
    <div id="assistantMessageMenu" class="custom-action-menu assistant-message-menu" role="menu" hidden>
      <button id="btnAssistantExportPdf"
              class="msg-action msg-action-pdf"
              type="button"
              role="menuitem"
              title="Save message as PDF">Сохранить как PDF</button>
    </div>
    <div id="customActionDeleteDialog" class="confirm-dialog" hidden>
      <div class="confirm-panel" role="alertdialog" aria-modal="true" aria-labelledby="customActionDeleteTitle">
        <div id="customActionDeleteTitle" class="confirm-title">Удалить действие?</div>
        <div id="customActionDeleteText" class="confirm-text"></div>
        <div class="confirm-actions">
          <button id="btnCustomActionDeleteCancel" class="btn btn-ghost" type="button">Отмена</button>
          <button id="btnCustomActionDeleteConfirm" class="btn btn-danger" type="button">Удалить</button>
        </div>
      </div>
    </div>
  </div>
  <script src="markdown.js"></script>
  <script src="chat.js"></script>
</body>
</html>
